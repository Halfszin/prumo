# Gera o instalador do Windows e publica na página de versões ao enviar uma tag vX.Y.Z
name: Instalador do Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      loja:
        description: 'Gerar também o pacote da Microsoft Store (.appx)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  loja:
        description: 'Gerar também o pacote da Microsoft Store (.appx)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  loja:
    # pacote para enviar à Microsoft Store (a Loja assina); fica nos artefatos da execução, não na página de versões
    if: ${{ inputs.loja }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node -e "if(require('./package.json').build.appx.identityName==='PREENCHER'){console.error('Preencha build.appx no package.json com os dados do Partner Center');process.exit(1)}"
      - run: npx electron-builder --win appx --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: prumo-loja
          path: dist/*.appx
