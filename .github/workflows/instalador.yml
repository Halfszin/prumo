# Gera o instalador do Windows e publica na página de versões ao enviar uma tag vX.Y.Z
name: Instalador do Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      loja:
        description: 'Gerar também o pacote da Microsoft Store (.appx)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  loja:
    # pacote para enviar à Microsoft Store (a Loja assina); vai junto na página da versão para baixar com link direto
    if: ${{ inputs.loja }}
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node -e "if(require('./package.json').build.appx.identityName==='PREENCHER'){console.error('Preencha build.appx no package.json com os dados do Partner Center');process.exit(1)}"
      - run: npx electron-builder --win appx --publish never
      - run: gh release upload "v$(node -p "require('./package.json').version")" dist/Prumo-Loja-*.appx --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
